# Include these locations inside the primary https://threadsgo.ru server block.
# Keep the existing /api/ proxy_pass location above them.

location = /login {
    add_header X-Robots-Tag "noindex, follow" always;
    try_files /login/index.html =404;
}

location ^~ /app/ {
    add_header X-Robots-Tag "noindex, follow" always;
    try_files $uri $uri/ /index.html;
}

error_page 404 =404 /404.html;

location = /404.html {
    internal;
}

location / {
    try_files $uri $uri/ $uri/index.html =404;
}

